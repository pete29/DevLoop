name: tests

# The offline suites: no model, no network beyond installing
# dependencies, no secrets. The four suites that call a real
# model are left out by tests/run_offline.py.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    # Windows, because that is where DevLoop runs: paths,
    # line endings and the console codepage have each broken
    # something before.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # tsc, Vitest and npm are looked up on PATH by the
      # gates; the suites fake their output, but not their
      # presence.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: python -m pip install -r requirements.txt

      # Several suites commit into throwaway repositories.
      - name: Git identity
        run: |
          git config --global user.name "DevLoop CI"
          git config --global user.email "ci@devloop.invalid"

      - name: Offline suites
        run: python tests/run_offline.py
