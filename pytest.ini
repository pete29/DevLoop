[pytest]
# The suite scripts (tests/*_test.py) are collected by
# tests/conftest.py, one item each, never imported here:
# importing one would run it (test_execution_test.py would
# match the default pattern). Tests written for pytest are
# named e2e_*.py and live in tests/e2e/.
python_files = e2e_*.py
testpaths = tests
addopts = -p no:cacheprovider
pythonpath = .
